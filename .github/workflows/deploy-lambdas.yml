name: Deploy Enrichment Lambdas

on:
  push:
    branches: [main]
    paths:
      - "services/enrichment-linkedin-lambda/**"
      - "services/enrichment-domain-lambda/**"
      - ".github/workflows/deploy-lambdas.yml"
      - "package-lock.json"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  LINKEDIN_LAMBDA_NAME: ${{ secrets.LINKEDIN_LAMBDA_NAME }}
  DOMAIN_LAMBDA_NAME: ${{ secrets.DOMAIN_LAMBDA_NAME }}
  LINKEDIN_CREDENTIAL_JSON: ${{ secrets.LINKEDIN_CREDENTIAL_JSON }}
  DOMAIN_CREDENTIAL_JSON: ${{ secrets.DOMAIN_CREDENTIAL_JSON }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          missing=0
          check_var() {
            if [ -z "$1" ]; then
              echo "::error::Missing GitHub secret: $2"
              missing=1
            fi
          }
          check_var "${AWS_REGION}" "AWS_REGION"
          check_var "${LINKEDIN_LAMBDA_NAME}" "LINKEDIN_LAMBDA_NAME"
          check_var "${DOMAIN_LAMBDA_NAME}" "DOMAIN_LAMBDA_NAME"
          check_var "${{ secrets.AWS_ACCESS_KEY_ID }}" "AWS_ACCESS_KEY_ID"
          check_var "${{ secrets.AWS_SECRET_ACCESS_KEY }}" "AWS_SECRET_ACCESS_KEY"
          check_var "${LINKEDIN_CREDENTIAL_JSON}" "LINKEDIN_CREDENTIAL_JSON"
          check_var "${DOMAIN_CREDENTIAL_JSON}" "DOMAIN_CREDENTIAL_JSON"
          if [ "$missing" -eq 1 ]; then
            echo "::error::Configure the missing secrets in Settings > Secrets and variables > Actions before rerunning."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build LinkedIn lambda package
        working-directory: services/enrichment-linkedin-lambda
        run: |
          rm -rf build linkedin_enrichment.zip
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --target build
          cp -R *.py build/
          cd build
          zip -r ../linkedin_enrichment.zip .

      - name: Deploy LinkedIn lambda
        if: env.LINKEDIN_LAMBDA_NAME != ''
        working-directory: services/enrichment-linkedin-lambda
        run: |
          aws lambda update-function-code \
            --function-name "$LINKEDIN_LAMBDA_NAME" \
            --zip-file fileb://linkedin_enrichment.zip \
            --publish

      - name: Update LinkedIn lambda env
        if: env.LINKEDIN_LAMBDA_NAME != ''
        run: |
          current=$(aws lambda get-function-configuration \
            --function-name "$LINKEDIN_LAMBDA_NAME" \
            --region "$AWS_REGION" \
            --query 'Environment.Variables' \
            --output json)
          python3 <<'PY'
import json, os, tempfile, subprocess
current = json.loads(os.environ['CURRENT'])
current['GOOGLE_APPLICATION_CREDENTIALS_JSON'] = os.environ['LINKEDIN_CREDENTIAL_JSON']
tmp = tempfile.NamedTemporaryFile(delete=False, suffix='.json')
with open(tmp.name, 'w') as fh:
    json.dump({'Variables': current}, fh)
subprocess.run([
    'aws', 'lambda', 'update-function-configuration',
    '--function-name', os.environ['LINKEDIN_LAMBDA_NAME'],
    '--region', os.environ['AWS_REGION'],
    '--environment', f'file://{tmp.name}'
], check=True)
PY
        env:
          CURRENT: $current

      - name: Build domain lambda package
        working-directory: services/enrichment-domain-lambda
        run: |
          rm -rf build domain_enrichment.zip
          python -m pip install -r requirements.txt --target build
          cp -R *.py build/
          cd build
          zip -r ../domain_enrichment.zip .

      - name: Deploy domain lambda
        if: env.DOMAIN_LAMBDA_NAME != ''
        working-directory: services/enrichment-domain-lambda
        run: |
          aws lambda update-function-code \
            --function-name "$DOMAIN_LAMBDA_NAME" \
            --zip-file fileb://domain_enrichment.zip \
            --publish

      - name: Update domain lambda env
        if: env.DOMAIN_LAMBDA_NAME != ''
        run: |
          current=$(aws lambda get-function-configuration \
            --function-name "$DOMAIN_LAMBDA_NAME" \
            --region "$AWS_REGION" \
            --query 'Environment.Variables' \
            --output json)
          python3 <<'PY'
import json, os, tempfile, subprocess
current = json.loads(os.environ['CURRENT'])
current['GOOGLE_APPLICATION_CREDENTIALS_JSON'] = os.environ['DOMAIN_CREDENTIAL_JSON']
tmp = tempfile.NamedTemporaryFile(delete=False, suffix='.json')
with open(tmp.name, 'w') as fh:
    json.dump({'Variables': current}, fh)
subprocess.run([
    'aws', 'lambda', 'update-function-configuration',
    '--function-name', os.environ['DOMAIN_LAMBDA_NAME'],
    '--region', os.environ['AWS_REGION'],
    '--environment', f'file://{tmp.name}'
], check=True)
PY
        env:
          CURRENT: $current

      - name: Clean up build artifacts
        if: always()
        run: |
          rm -rf services/enrichment-linkedin-lambda/build services/enrichment-linkedin-lambda/linkedin_enrichment.zip
          rm -rf services/enrichment-domain-lambda/build services/enrichment-domain-lambda/domain_enrichment.zip
