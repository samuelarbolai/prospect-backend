name: Deploy Enrichment Lambdas

on:
  push:
    branches: [main]
    paths:
      - "services/enrichment-linkedin-lambda/**"
      - "services/enrichment-domain-lambda/**"
      - ".github/workflows/deploy-lambdas.yml"
      - "package-lock.json"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  LINKEDIN_LAMBDA_NAME: ${{ secrets.LINKEDIN_LAMBDA_NAME }}
  DOMAIN_LAMBDA_NAME: ${{ secrets.DOMAIN_LAMBDA_NAME }}

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build LinkedIn lambda package
        working-directory: services/enrichment-linkedin-lambda
        run: |
          rm -rf build linkedin_enrichment.zip
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --target build
          cp -R *.py build/
          cd build
          zip -r ../linkedin_enrichment.zip .

      - name: Deploy LinkedIn lambda
        if: env.LINKEDIN_LAMBDA_NAME != ''
        working-directory: services/enrichment-linkedin-lambda
        run: |
          aws lambda update-function-code \
            --function-name "$LINKEDIN_LAMBDA_NAME" \
            --zip-file fileb://linkedin_enrichment.zip \
            --publish

      - name: Build domain lambda package
        working-directory: services/enrichment-domain-lambda
        run: |
          rm -rf build domain_enrichment.zip
          python -m pip install -r requirements.txt --target build
          cp -R *.py build/
          cd build
          zip -r ../domain_enrichment.zip .

      - name: Deploy domain lambda
        if: env.DOMAIN_LAMBDA_NAME != ''
        working-directory: services/enrichment-domain-lambda
        run: |
          aws lambda update-function-code \
            --function-name "$DOMAIN_LAMBDA_NAME" \
            --zip-file fileb://domain_enrichment.zip \
            --publish

      - name: Clean up build artifacts
        if: always()
        run: |
          rm -rf services/enrichment-linkedin-lambda/build services/enrichment-linkedin-lambda/linkedin_enrichment.zip
          rm -rf services/enrichment-domain-lambda/build services/enrichment-domain-lambda/domain_enrichment.zip
