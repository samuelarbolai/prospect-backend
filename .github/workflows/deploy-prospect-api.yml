name: Deploy Prospect API

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install prospect-api dependencies
        run: npm install
        working-directory: services/prospect-api

      - name: Build prospect API
        run: npm run build
        working-directory: services/prospect-api

      - name: Install prospect-lists-api dependencies
        run: npm install
        working-directory: services/prospect-lists-api

      - name: Build lists API
        run: npm run build
        working-directory: services/prospect-lists-api

      - name: Install linkedin-enrichment-service dependencies
        run: npm install
        working-directory: services/linkedin-enrichment-service

      - name: Install linkedin-enrichment-service docs dependencies
        run: npm install
        working-directory: services/linkedin-enrichment-service/docs-site

      - name: Build linkedin-enrichment-service
        run: npm run build
        working-directory: services/linkedin-enrichment-service

      - name: Backend smoke tests (deployed endpoints)
        run: node scripts/test-backend.mjs
        env:
          PROSPECT_API_BASE: https://prospect-api-633098049477.us-central1.run.app
          LISTS_API_BASE: https://prospect-lists-api-633098049477.us-central1.run.app

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Required for authenticating to GCP

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/YOUR_PROJECT_NUMBER/locations/global/workloadIdentityPools/YOUR_POOL_ID/providers/YOUR_PROVIDER_ID'
          service_account: 'YOUR_GCP_SERVICE_ACCOUNT_EMAIL'

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: prospect-backend
          region: us-central1
          source: . # Build from the root of the repository