AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM Template for LinkedIn Enrichment Lambda (Container)

Globals:
  Function:
    MemorySize: 2048
    Timeout: 300  # 5 minutes

Resources:
  EnrichmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: linkedin-enrichment
      PackageType: Image
      Architectures:
        - x86_64
      # If you supply Role, SAM ignores Policies. Keep Role OR Policies (not both).
      Role: arn:aws:iam::856121895401:role/prospect-enrichment-lambda
      # (No ImageUri here — SAM will build from Metadata below)
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest
